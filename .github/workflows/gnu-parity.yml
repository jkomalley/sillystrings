name: GNU parity

# GNU binutils strings is the reference for all of sillystrings' output, so check
# it directly: build ELF and Mach-O files from scripts/gnu_fixture.c, add a seeded
# random corpus, and require scripts/compare_gnu.py to find byte-identical output
# in every encoding under both -d and -a.
#
# The reference is one pinned binutils release, built from source for every
# target as Homebrew builds it, so it reads both formats and only changes when
# BINUTILS_VERSION does. Distribution packages can't stand in: even Ubuntu's
# binutils-multiarch leaves out Mach-O. The build takes about a minute and is
# cached, so later runs restore it in seconds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

env:
  BINUTILS_VERSION: "2.47"
  # Homebrew's checksum for the same tarball
  BINUTILS_SHA256: 3068128c75cda9f898ccb4211d360246e8e195ffcc9dfb655b23ae23a54800e8
  GNU_STRINGS: ${{ github.workspace }}/../gnu-strings/strings
  CLANG: clang-21

jobs:
  compare:
    # Pinned so the cached build and the image's clang stay compatible
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Restore GNU strings
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.GNU_STRINGS }}
          key: gnu-strings-${{ env.BINUTILS_VERSION }}-ubuntu-26.04-${{ runner.arch }}

      - name: Build GNU strings
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          tarball="binutils-$BINUTILS_VERSION.tar.bz2"
          curl -fsSL -o "$tarball" "https://ftpmirror.gnu.org/binutils/$tarball"
          echo "$BINUTILS_SHA256  $tarball" | sha256sum -c -
          tar xjf "$tarball"
          cd "binutils-$BINUTILS_VERSION"
          ./configure -q --enable-targets=all --enable-64-bit-bfd --disable-shared \
            --disable-nls --disable-werror --disable-gdb --disable-gdbserver \
            --disable-gprofng --disable-sim --disable-ld --disable-gold \
            --disable-gas --disable-libctf
          make -s -j"$(nproc)" MAKEINFO=true all-binutils
          mkdir -p "$(dirname "$GNU_STRINGS")"
          cp binutils/strings "$GNU_STRINGS"

      - name: Install dependencies
        run: uv sync

      - name: Build the corpus
        run: |
          mkdir corpus
          # ELF, linked by the system toolchain
          gcc -c -o corpus/fixture.o scripts/gnu_fixture.c
          gcc -shared -fPIC -o corpus/fixture.so scripts/gnu_fixture.c
          gcc -o corpus/fixture scripts/gnu_fixture.c
          ar rcs corpus/fixture.a corpus/fixture.o
          cp /usr/bin/ls corpus/ls
          # ELF in the other word sizes and byte orders
          for target in i386-linux-gnu powerpc-linux-gnu s390x-linux-gnu; do
            $CLANG --target="$target" -ffreestanding -c \
              -o "corpus/fixture-$target.o" scripts/gnu_fixture.c
          done
          # Thin Mach-O of each kind, then a fat executable
          for arch in arm64 x86_64; do
            macho=(--target="$arch-apple-macos11" -ffreestanding -nostdlib -fuse-ld=lld)
            $CLANG "${macho[@]}" -c -o "corpus/fixture-$arch-macho.o" scripts/gnu_fixture.c
            $CLANG "${macho[@]}" -shared -o "corpus/fixture-$arch.dylib" scripts/gnu_fixture.c
            $CLANG "${macho[@]}" -Wl,-e,_main -o "corpus/fixture-$arch-macho" scripts/gnu_fixture.c
          done
          llvm-lipo-21 -create corpus/fixture-arm64-macho corpus/fixture-x86_64-macho \
            -output corpus/fixture-fat-macho
          uv run scripts/random_corpus.py random

      - name: Compare with GNU strings
        run: >
          uv run scripts/compare_gnu.py --gnu "$GNU_STRINGS"
          -e s -e S -e l -e b -e L -e B corpus/* random/*
