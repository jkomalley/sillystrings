[project]
name = "sillystrings"
version = "0.1.0"
description = "A Python reimplementation of the Unix strings utility"
readme = "README.md"
authors = [{ name = "Kyle O'Malley", email = "j.kyle.omalley@gmail.com" }]
requires-python = ">=3.11"
lincese = "MIT"
keywords = ["strings", "cli", "text", "utility"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Enviroment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"'
    "Topic :: Utilities",
    "Typing :: Typed",
]



[project.urls]
Homepage = "https://github.com/jkomalley/sillystrings"
Repository = "https://github.com/jkomalley/sillystrings"
Issues = "https://github.com/jkomalley/sillystrings/issues"
Changelog = "https://github.com/jkomalley/sillystrings/blob/main/CHANGELOG.md"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[project.scripts]
sillystrings = "sillystrings.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sillystrings --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # annotations
]

[tool.ruff.format]
quote-style = "double"
